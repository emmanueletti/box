version: 2

tools:
  markdownlint-cli2: &markdownlint-cli2
    lint-command: 'markdownlint-cli2 --config $HOME/.config/markdownlint/config.jsonc ${INPUT}'
    lint-stdin: false
    lint-ignore-exit-code: true
    # efm only lints on change/save by default, so a freshly opened file shows
    # nothing until you touch it. Lint on open too.
    lint-after-open: true
    root-markers:
      - .markdownlint.jsonc
      - .markdownlint.json
      - .markdownlint.yaml
      - .markdownlint-cli2.jsonc
    lint-formats:
      - '%f:%l:%c %m'
      - '%f:%l %m'

languages:
  markdown:
    - *markdownlint-cli2
