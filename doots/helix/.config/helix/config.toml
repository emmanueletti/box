# TODO: once plugin system is finished, add the following plugins
# https://github.com/thomasschafer/scooter.hx

theme = "dark_plus"

[editor]
text-width = 80
scrolloff = 5
true-color = true
bufferline = "multiple"
color-modes = true
end-of-line-diagnostics = "disable"
cursorline = true

[editor.auto-save]
focus-lost = true
after-delay.enable = true
after-delay.timeout = 500

[editor.file-picker]
hidden = false

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "disable"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
center = ["diagnostics"]

[editor.soft-wrap]
enable = true
wrap-at-text-width = true

[editor.whitespace]
render = { newline = "none" }
characters = { newline = "¬" }

[keys.normal]
"C-/" = ["toggle_comments"]
esc = "collapse_selection"
x = "select_line_below"
X = "select_line_above"
S-left = "goto_previous_buffer"
S-right = "goto_next_buffer"
S-z = ":toggle gutters.line-numbers.min-width 3 40 95" # cycle gutter width
C-left = "move_prev_word_start"
C-right = "move_next_word_start"
C-home = "jump_view_left"
C-end = "jump_view_right"
C-del = "delete_word_forward"
C-backspace = "delete_word_backward"
A-w = ":buffer-close"
A-q = ":quit"
C-r = ":reload-all"
C-n = ':sh box-clipboard-copy %{buffer_name}'
C-s = ":format"
C-j = "save_selection"
ret = "goto_word"
"C-`" = "switch_case"
a = ["append_mode", "collapse_selection"]
D = "delete_selection_noyank" # A-d is the default for this
home = "goto_first_nonwhitespace"
"^" = "extend_to_first_nonwhitespace"
"$" = "extend_to_line_end"
V = ["goto_first_nonwhitespace", "extend_to_line_end"]
S-down = [
  "extend_to_line_bounds",
  "delete_selection",
  "paste_after",
  "select_mode",
  "goto_line_start",
  "normal_mode",
]
S-up = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
  "flip_selections",
]

[keys.normal.space]
space = "command_palette"
l = "file_picker_in_current_buffer_directory"
f = "file_picker_in_current_directory"
F = "file_picker"

[keys.normal.g]
left = "goto_first_nonwhitespace"
right = "goto_line_end"

[keys.insert]
j = { j = "normal_mode" }
C-del = "delete_word_forward"
C-backspace = "delete_word_backward"
C-left = "move_prev_word_start"
C-right = "move_next_word_start"

[keys.select]
x = "select_line_below"
X = "select_line_above"
"^" = "extend_to_first_nonwhitespace"

[keys.select.g]
left = "goto_first_nonwhitespace"
right = "goto_line_end"

# space t = toggles
[keys.normal.space.t]
a = ":theme dark_plus"
b = ":theme solarized_light"
w = ":toggle soft-wrap.enable"
r = ":toggle line-number relative absolute"
g = ":toggle indent-guides.render"
f = ":toggle auto-format"
c = ":toggle auto-completion"
h = ":toggle lsp.display-inlay-hints"
d = ":toggle inline-diagnostics.cursor-line hint disable"
m = ":toggle whitespace.render.newline none all"
z = [
  ":toggle auto-completion",
  ":toggle lsp.display-inlay-hints",
  ":toggle inline-diagnostics.cursor-line hint disable",
]

# space x = execute scripts
[keys.normal.space.x]
f = ':open %sh{~/.config/helix/scripts/rails-file-to-test.sh %{buffer_name}}'
p = ':open %sh{ruby ~/.config/helix/scripts/rails-render-to-partial.rb %{buffer_name} %{cursor_line}}'
i = ':open %sh{ruby ~/.config/helix/scripts/rails-i18n-key-to-entry.rb %{buffer_name} %{cursor_line}}'
t = [":buffer-close! tmp/helix_test.log", ':vsplit %sh{ruby ~/.config/helix/scripts/rails-run-test-at-cursor.rb %{buffer_name} %{cursor_line}}']
T = [":buffer-close! tmp/helix_test.log", ':vsplit %sh{~/.config/helix/scripts/rails-run-test-file.sh %{buffer_name}}']
s = ':open %sh{ruby ~/.config/helix/scripts/rails-model-to-schema.rb %{buffer_name}}'
j = ':open %sh{ruby ~/.config/helix/scripts/rails-view-to-stimulus.rb %{buffer_name} %{cursor_line}}'
c = ':open %sh{ruby ~/.config/helix/scripts/rails-model-to-factory.rb %{buffer_name}}'
r = ':echo %sh{ruby ~/.config/helix/scripts/rails-action-to-route.rb %{buffer_name} %{cursor_line}}'
e = ':pipe ruby ~/.config/helix/scripts/rails-extract-partial.rb %{buffer_name}'
d = ':echo %sh{echo "${PWD##*/}/%{buffer_name}"}'
w = ':pipe fmt -w 80'

[keys.select.space.x]
e = ':pipe ruby ~/.config/helix/scripts/rails-extract-partial.rb %{buffer_name}'
w = ':pipe fmt -w 80'
