[tools]
go = "latest"
node = "latest"
python = "latest"
ruby = "latest"
rust = "latest"
uv = "latest"

"gem:herb" = "latest"
"gem:rails" = "latest"
# gem backend does not filter prereleases; "latest" resolves to 0.27.0.beta4.
"gem:ruby-lsp" = "0.26"
"gem:standard" = "latest"

"npm:@herb-tools/language-server" = "latest"
"npm:@microsoft/compose-language-service" = "latest"
"npm:@olrtg/emmet-language-server" = "latest"
"npm:emmet" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:prettier" = "latest"

"github:mattn/efm-langserver" = "latest"
"github:docker/docker-language-server" = { version = "latest", bin = "docker-language-server" }

marksman = "latest"

"github:erasin/hx-lsp" = "latest"

resvg = "latest"
stripe = "latest"
"github:render-oss/cli" = { version = "latest", bin = "render" }

[settings]
prefer_offline = true

[settings.ruby]
compile = false

[settings.github]
credential_command = "gh auth token"
