font=JetBrains Mono:weight=demibold:size=11,Symbols Nerd Font Mono:size=14
pad=12x12
dpi-aware=yes
box-drawings-uses-font-glyphs=yes
initial-window-size-chars=100x28
selection-target=both

initial-color-theme=light
include=/usr/share/foot/themes/tempus-day
include=/usr/share/foot/themes/moonfly

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[cursor]
style=block

[mouse]
hide-when-typing=yes

[csd]
size=0

[key-bindings]
fullscreen=Control+Return
