font=JetBrains Mono:size=11,Symbols Nerd Font Mono:size=14
pad=12x12
dpi-aware=yes
box-drawings-uses-font-glyphs=yes
initial-window-size-chars=100x28
selection-target=both

include=/usr/share/foot/themes/catppuccin-mocha

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[cursor]
style=block

[mouse]
hide-when-typing=yes

[csd]
size=0

[key-bindings]
clipboard-paste=Control+v
fullscreen=Control+Return
