# ─────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# Index windows/panes from 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi keys in copy mode
setw -g mode-keys vi

# ─────────────────────────────────────────────────────────
# Keybinds
# ─────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Kill pane/window with no confirm prompt
bind x kill-pane
bind X kill-window

# Type into every pane in the window at once
bind y setw synchronize-panes

# Popup lazygit over the current layout
bind g display-popup -w 90% -h 90% -E "lazygit"

# Popup a persistent scratch shell over the current layout
bind Enter display-popup -w 90% -h 90% -E "tmux new-session -A -s scratch"

# Send copy-mode selection to the system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "box-clipboard-copy"

# Flag a window in the status bar when something happens in it in the background
setw -g monitor-activity on
set -g visual-activity on

# Terminal tab title follows the active pane
set -g set-titles on
set -g set-titles-string "#T"

# Toggle outer/inner prefix when nested in another tmux (e.g. over SSH)
bind -n C-Space set -g key-table off \; display-message "OFF"
bind -T off Space set -g key-table root \; display-message "ON"

# ─────────────────────────────────────────────────────────
# Status bar
# ─────────────────────────────────────────────────────────
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=black#,bg=yellow#,bold] PRFX #[default], TMUX } [#S] "
set -g status-justify absolute-centre
set -g status-right "#(whoami)@#H"

setw -g window-status-current-style "fg=black,bg=blue,bold"
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
